<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF">
        <animate attributeName="stop-color" values="#0A84FF;#5E5CE6;#0A84FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5E5CE6">
        <animate attributeName="stop-color" values="#5E5CE6;#0A84FF;#5E5CE6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="16"/></clipPath>
    <style>
      .name { font: 700 46px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; animation: rise 1.2s ease-out both; }
      .tag  { font: 500 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <circle cx="120" cy="60" r="36" fill="#fff" opacity=".08">
      <animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="50" r="52" fill="#fff" opacity=".07">
      <animate attributeName="cy" values="50;75;50" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="120" r="20" fill="#fff" opacity=".08">
      <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text class="name" x="500" y="82" text-anchor="middle">Muhammad Axmadaliyev</text>

    <text class="tag" x="500" y="128" text-anchor="middle" opacity="0">Mobile Developer · Flutter &amp; iOS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text class="tag" x="500" y="128" text-anchor="middle" opacity="0">Apps serving 1,000,000+ users
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text class="tag" x="500" y="128" text-anchor="middle" opacity="0">#1 in Finance on Google Play &amp; App Store
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>

    <path fill="#fff" fill-opacity=".10" d="M0,170 q62.5,-24 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path fill="#fff" fill-opacity=".14" d="M0,180 q62.5,-18 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path fill="#fff" fill-opacity=".20" d="M0,192 q62.5,-14 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
